name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine, model, Android modules)
        run: ./gradlew :core:model:test :core:engine:test testDebugUnitTest

      - name: Privacy guard (no INTERNET permission)
        run: ./gradlew :app:verifyNoInternetPermission

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build
        run: ./gradlew assembleDebug assembleRelease
